name: Build Cerberus Android APK

on:
  push:
    branches:
      - agent/cerberus-android-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Cerberus Signal Lab v0.2
        working-directory: cerberus-android-demo
        run: gradle --no-daemon :app:assembleDebug

      - name: Package artifact
        run: |
          cp cerberus-android-demo/app/build/outputs/apk/debug/app-debug.apk Cerberus-Signal-Lab-v0.2-debug.apk
          sha256sum Cerberus-Signal-Lab-v0.2-debug.apk | tee Cerberus-Signal-Lab-v0.2-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cerberus-Signal-Lab-v0.2-APK
          path: |
            Cerberus-Signal-Lab-v0.2-debug.apk
            Cerberus-Signal-Lab-v0.2-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
