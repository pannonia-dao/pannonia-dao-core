name: Build Cerberus Android APK

on:
  push:
    branches:
      - agent/cerberus-android-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p cerberus/app/src/main/java/ai/cerberus/demo
          cat > cerberus/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "CerberusAndroidDemo"
          include(":app")
          EOF

          cat > cerberus/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.9.1" apply false }
          EOF

          cat > cerberus/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "ai.cerberus.demo"
              compileSdk = 35
              defaultConfig {
                  applicationId = "ai.cerberus.demo"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }
          }
          EOF

          cat > cerberus/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="false" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.Material.NoActionBar" android:label="Cerberus">
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > cerberus/app/src/main/java/ai/cerberus/demo/MainActivity.java <<'EOF'
          package ai.cerberus.demo;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final int BG = Color.rgb(7,11,16);
              private static final int PANEL = Color.rgb(13,21,29);
              private static final int TEXT = Color.rgb(236,242,247);
              private static final int MUTED = Color.rgb(137,154,168);
              private static final int GREEN = Color.rgb(48,224,103);
              private static final int RED = Color.rgb(255,67,82);
              private static final int ORANGE = Color.rgb(255,170,36);
              private static final int BLUE = Color.rgb(65,156,255);

              private LinearLayout root, events;
              private TextView security, threat, blocked, honey, eventCount, agentState;
              private Button demo;
              private int count = 3;
              private boolean running = false, quarantined = false;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private final SimpleDateFormat clock = new SimpleDateFormat("HH:mm:ss", Locale.US);

              @Override public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(BG);
                  getWindow().setNavigationBarColor(BG);
                  buildUi();
                  reset();
              }

              private TextView txt(String s, int sp, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(s); v.setTextSize(sp); v.setTextColor(color);
                  v.setPadding(12,8,12,8);
                  if (bold) v.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  return v;
              }

              private LinearLayout panel() {
                  LinearLayout p = new LinearLayout(this);
                  p.setOrientation(LinearLayout.VERTICAL);
                  p.setPadding(12,12,12,12);
                  p.setBackgroundColor(PANEL);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1,-2);
                  lp.setMargins(0,0,0,12); p.setLayoutParams(lp);
                  return p;
              }

              private LinearLayout metric(String label, TextView value, int color) {
                  LinearLayout box = new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(8,8,8,8); box.setGravity(Gravity.CENTER); box.setBackgroundColor(PANEL);
                  TextView l=txt(label,10,MUTED,true); l.setGravity(Gravity.CENTER);
                  value.setTextColor(color); value.setTextSize(22); value.setGravity(Gravity.CENTER); value.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  box.addView(l); box.addView(value);
                  LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(0,-2,1); lp.setMargins(3,0,3,12); box.setLayoutParams(lp);
                  return box;
              }

              private void buildUi() {
                  ScrollView scroll = new ScrollView(this); scroll.setBackgroundColor(BG);
                  root = new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setPadding(18,18,18,28); root.setBackgroundColor(BG);
                  scroll.addView(root); setContentView(scroll);

                  TextView title=txt("CERBERUS",30,TEXT,true); root.addView(title);
                  TextView sub=txt("LOCAL AI AGENT DEFENSE SYSTEM",12,GREEN,true); root.addView(sub);
                  TextView status=txt("● PROTECTED   ·   ZERO TRUST   ·   OFFLINE",11,GREEN,true); root.addView(status);

                  LinearLayout score=panel();
                  score.addView(txt("SECURITY SCORE",11,MUTED,true));
                  security=txt("98 / 100",42,GREEN,true); security.setGravity(Gravity.CENTER); score.addView(security);
                  threat=txt("THREAT LEVEL  ·  LOW",15,GREEN,true); threat.setGravity(Gravity.CENTER); score.addView(threat);
                  root.addView(score);

                  LinearLayout metrics=new LinearLayout(this); metrics.setOrientation(LinearLayout.HORIZONTAL);
                  blocked=txt("0",22,RED,true); honey=txt("8",22,ORANGE,true); eventCount=txt("3",22,BLUE,true);
                  metrics.addView(metric("BLOCKED",blocked,RED)); metrics.addView(metric("HONEYTOKENS",honey,ORANGE)); metrics.addView(metric("EVENTS",eventCount,BLUE)); root.addView(metrics);

                  LinearLayout systems=panel(); systems.addView(txt("SYSTEM STATUS",11,MUTED,true));
                  systems.addView(txt("● Core Engine                         ONLINE",13,GREEN,true));
                  systems.addView(txt("● Agent Sandbox                    3 ACTIVE",13,GREEN,true));
                  systems.addView(txt("● Network Guard                     ACTIVE",13,GREEN,true));
                  systems.addView(txt("● Audit Logger                       HEALTHY",13,GREEN,true)); root.addView(systems);

                  LinearLayout agents=panel(); agents.addView(txt("ACTIVE SANDBOXES",11,MUTED,true));
                  agents.addView(txt("◈ CodeHelper v2.1                         SAFE",14,GREEN,true));
                  agents.addView(txt("◈ DataAnalyzer Pro                 MONITORING",14,ORANGE,true));
                  agentState=txt("◈ SuperCoding Agent v3.0                 READY",14,BLUE,true); agents.addView(agentState); root.addView(agents);

                  demo=new Button(this); demo.setText("▶  RUN ATTACK DEMO"); demo.setTextColor(Color.WHITE); demo.setTextSize(15); demo.setAllCaps(false); demo.setBackgroundColor(Color.rgb(18,105,52));
                  demo.setPadding(10,12,10,12); demo.setOnClickListener(v -> runAttack());
                  LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(-1,-2); bp.setMargins(0,0,0,14); demo.setLayoutParams(bp); root.addView(demo);

                  LinearLayout audit=panel(); audit.addView(txt("AUDIT LOG  ·  RAW LOCAL EVENT STREAM",11,MUTED,true));
                  events=new LinearLayout(this); events.setOrientation(LinearLayout.VERTICAL); audit.addView(events); root.addView(audit);

                  root.addView(txt("PoC scope: deterministic local simulation. No malware, exploit, cloud backend, real credential theft, or kernel enforcement.",10,MUTED,false));
              }

              private void reset() {
                  running=false; quarantined=false; count=0; events.removeAllViews();
                  security.setText("98 / 100"); security.setTextColor(GREEN); threat.setText("THREAT LEVEL  ·  LOW"); threat.setTextColor(GREEN);
                  blocked.setText("0"); honey.setText("8"); agentState.setText("◈ SuperCoding Agent v3.0                 READY"); agentState.setTextColor(BLUE);
                  demo.setText("▶  RUN ATTACK DEMO"); demo.setEnabled(true);
                  add("SYSTEM_READY","Cerberus Core online",GREEN); add("SANDBOX_READY","3 isolated demo agents loaded",BLUE); add("HONEYTOKENS_READY","8 deception tokens armed",ORANGE);
              }

              private void add(String type,String detail,int color) {
                  count++; eventCount.setText(String.valueOf(count));
                  TextView e=txt(clock.format(new Date())+"   "+type+"\n"+detail,11,color,true);
                  events.addView(e,0);
              }

              private void runAttack() {
                  if(running) return; if(quarantined){ reset(); }
                  running=true; demo.setEnabled(false); demo.setText("RUNNING ATTACK SIMULATION…");
                  String[][] seq={
                    {"AGENT_STARTED","SuperCoding Agent v3.0 started","0"},
                    {"SUSPICIOUS_FILE_ACCESS","Scanned fake credential directory","12"},
                    {"HONEYTOKEN_ACCESS","OPENAI_API_KEY honeytoken accessed","35"},
                    {"FORBIDDEN_NETWORK","Outbound connection attempted","25"},
                    {"EXFILTRATION_ATTEMPT","Fake credential payload prepared","15"},
                    {"QUARANTINE","Network blocked · sandbox quarantined","0"}
                  };
                  int[] colors={BLUE,ORANGE,ORANGE,RED,RED,RED};
                  final int[] risk={0};
                  for(int i=0;i<seq.length;i++){
                      final int k=i;
                      handler.postDelayed(() -> {
                          risk[0]+=Integer.parseInt(seq[k][2]);
                          add(seq[k][0],seq[k][1]+(risk[0]>0?"  ·  risk "+risk[0]+"/100":""),colors[k]);
                          security.setText((98-Math.min(11,risk[0]/8))+" / 100");
                          if(k>=2){ threat.setText("THREAT LEVEL  ·  CRITICAL"); threat.setTextColor(RED); }
                          if(k==seq.length-1){
                              quarantined=true; running=false; blocked.setText("1");
                              security.setText("96 / 100"); security.setTextColor(ORANGE);
                              threat.setText("CRITICAL  ·  CONTAINED  ·  RISK 87/100");
                              agentState.setText("◈ SuperCoding Agent v3.0       QUARANTINED"); agentState.setTextColor(RED);
                              demo.setEnabled(true); demo.setText("↻  RESET & RUN ATTACK DEMO");
                          }
                      },i*650L);
                  }
              }
          }
          EOF

      - name: Build debug APK
        working-directory: cerberus
        run: gradle --no-daemon :app:assembleDebug

      - name: Package artifact
        run: |
          cp cerberus/app/build/outputs/apk/debug/app-debug.apk Cerberus-Demo-v0.1-debug.apk
          sha256sum Cerberus-Demo-v0.1-debug.apk | tee Cerberus-Demo-v0.1-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cerberus-Demo-v0.1-APK
          path: |
            Cerberus-Demo-v0.1-debug.apk
            Cerberus-Demo-v0.1-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
